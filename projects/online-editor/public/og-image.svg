    <path d="M100 100L140 140L100 180" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="160" y1="180" x2="240" y2="180" stroke="white" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">
